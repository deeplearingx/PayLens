<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PayLens 支付异常工作台</title>
  <style>
    :root{color-scheme:light;--ink:#17231f;--muted:#64736e;--line:#dce5df;--paper:#f4f7f4;--panel:#fff;--green:#176b50;--pale:#e7f3ed;--amber:#986213;--red:#a63d37}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 "Segoe UI","Microsoft YaHei",sans-serif}
    header{display:flex;align-items:center;justify-content:space-between;padding:20px clamp(18px,4vw,58px);background:#102c23;color:#fff}
    .brand{font-size:21px;font-weight:700;letter-spacing:.02em}.brand small{display:block;font-size:12px;font-weight:400;color:#b4c9bf;letter-spacing:.08em}
    .badge{border:1px solid #7fae98;border-radius:999px;padding:4px 11px;color:#dbf0e4;font-size:12px}
    main{max-width:1440px;margin:26px auto;padding:0 20px}.intro{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:18px}.intro h1{margin:0;font-size:26px}.intro p{margin:4px 0 0;color:var(--muted)}
    .grid{display:grid;grid-template-columns:minmax(280px,360px) minmax(0,1fr);gap:18px;align-items:start}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 3px 14px #18372b0a}.panel-head{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.panel-head h2{margin:0;font-size:16px}.panel-body{padding:16px}
    button,select{font:inherit;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);padding:8px 11px}button{cursor:pointer}button.primary{background:var(--green);border-color:var(--green);color:white}button.soft{background:var(--pale);border-color:#c7e2d3;color:#185e47}button.warn{color:var(--red)}button:disabled{opacity:.55;cursor:wait}
    .scenarios{margin-bottom:18px}.scenario-controls{display:flex;gap:8px;flex-wrap:wrap}.hint{font-size:12px;color:var(--muted);margin:10px 0 0}
    .list{display:flex;flex-direction:column;gap:8px}.row{width:100%;text-align:left;padding:11px;border:1px solid var(--line);border-radius:8px;background:#fff}.row.active{border-color:var(--green);background:#f2faf5}.row strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row span{font-size:12px;color:var(--muted)}
    .status{font-size:12px;padding:2px 8px;border-radius:999px;background:#edf1ee;color:#475750}.status.pending{background:#fff1d9;color:#815208}.status.success{background:#e2f2e8;color:#176b50}
    .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.section{border:1px solid var(--line);border-radius:9px;padding:14px}.section h3{font-size:14px;margin:0 0 12px}.timeline{display:flex;flex-direction:column;gap:11px}.event{border-left:2px solid #a9cdb9;padding:0 0 2px 12px}.event time{display:block;font-size:11px;color:var(--muted)}.event p{margin:2px 0 0}.event small{color:var(--muted)}
    .analysis{grid-column:1/-1}.analysis-actions{display:flex;gap:8px;flex-wrap:wrap}.result-block{margin-top:14px}.result-block h4{margin:12px 0 5px;font-size:13px}.result-block p,.result-block li{margin:4px 0}.result-block ul{padding-left:20px}.fact{padding:8px 10px;background:#f5f8f5;border-radius:6px;margin:6px 0}.cite{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:#376550}
    .empty{padding:25px 12px;text-align:center;color:var(--muted)}.notice{margin-top:12px;color:var(--muted);font-size:12px}.alert{padding:10px 12px;border-radius:7px;background:#fff3ef;color:#8b3931;margin:12px 0}.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    @media(max-width:900px){.grid{grid-template-columns:1fr}.detail-grid{grid-template-columns:1fr}.analysis{grid-column:auto}.intro{align-items:start;flex-direction:column}}
  </style>
</head>
<body>
<header><div class="brand">PayLens<small>PAYMENT INCIDENT WORKBENCH</small></div><nav><a href="/paylens/incidents">批量事件工作台</a>　<span class="badge">模拟数据 · 人工复核</span></nav></header>
<main>
  <div class="intro"><div><h1>支付异常分析工作台</h1><p>复现支付状态差异，查看交易证据，并获取可核对的 AI 排查建议。</p></div><button id="refresh">刷新异常订单</button></div>
  <section class="panel scenarios"><div class="panel-head"><h2>故障场景模拟</h2><span class="status">需要异常订单管理权限</span></div><div class="panel-body">
    <div class="scenario-controls"><select id="scenario"><option value="NORMAL_SUCCESS">正常成功回调</option><option value="CALLBACK_LOST">通道成功、回调丢失</option><option value="LATE_SUCCESS">本地关单后收到成功</option><option value="DUPLICATE_CALLBACK">重复成功回调</option><option value="QUERY_TIMEOUT">查单超时、结果未知</option></select><button id="runScenario" class="primary">创建模拟交易</button><button id="replay" class="soft" hidden>回放成功回调</button></div><p class="hint">场景调用 DaxPay 建单、回调和超时处理服务；数据仅用于本地演示。启用前请配置专用演示商户。</p><div id="scenarioMessage" class="notice"></div>
  </div></section>
  <div class="grid">
    <section class="panel"><div class="panel-head"><h2>演示交易与待处理异常</h2><span id="count" class="status">0</span></div><div class="panel-body"><h3>最近演示交易</h3><div id="demoTradeList" class="list"><div class="empty">正在读取演示交易…</div></div><h3 style="margin-top:18px">待处理异常</h3><div id="anomalyList" class="list"><div class="empty">正在读取异常订单…</div></div></div></section>
    <section class="panel"><div class="panel-head"><h2>交易详情</h2><span id="tradeStatus" class="status">未选择</span></div><div id="detail" class="panel-body"><div class="empty">从左侧选择一笔待处理异常单。</div></div></section>
  </div>
</main>
<script>
const api='/paylens/api';
let selected=null,selectedTradeNo=null,currentDetail=null,lastScenarioTrade=null,activeTask=null;
let selectionVersion=0,pollTimer=null,currentSnapshotHash=null,historyTasks=[];
const $=id=>document.getElementById(id);
async function request(path,options={}){
  const response=await fetch(api+path,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(options.headers||{})},...options});
  const isJson=(response.headers.get('content-type')||'').includes('json');
  const body=isJson?await response.json():await response.text();
  if(!response.ok)throw new Error(typeof body==='string'?body:(body.message||body.msg||`请求失败 ${response.status}`));
  if(isJson&&body&&typeof body.code==='number'&&body.code!==0)throw new Error(body.message||body.msg||`业务请求失败 ${body.code}`);
  return body&&Object.hasOwn(body,'data')?body.data:body;
}
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(value){return value?new Date(value).toLocaleString('zh-CN'):'时间未知'}
function showMessage(node,message,error=false){node.textContent=message;node.className=error?'alert':'notice'}
function cancelPolling(){if(pollTimer){clearTimeout(pollTimer);pollTimer=null}activeTask=null}
async function loadAnomalies(){const node=$('anomalyList');node.replaceChildren();try{const rows=await request('/anomalies');$('count').textContent=rows.length;if(!rows.length){node.innerHTML='<div class="empty">当前没有待处理异常。</div>';return}rows.forEach(item=>{const button=document.createElement('button');button.className='row'+(selected===item.id?' active':'');button.innerHTML=`<strong>${esc(item.tradeNo)} · ${esc(item.title)}</strong><span>本地 ${esc(item.localStatus)}　通道 ${esc(item.channelStatus)}　${fmt(item.createdAt)}</span>`;button.onclick=()=>selectAnomaly(item.id);node.append(button)})}catch(e){node.innerHTML=`<div class="alert">${esc(e.message)}</div>`}}
async function loadDemoTrades(){const node=$('demoTradeList');node.replaceChildren();try{const rows=await request('/trades');if(!rows.length){node.innerHTML='<div class="empty">尚无演示交易，先创建一个故障场景。</div>';return}rows.forEach(item=>{const button=document.createElement('button');button.className='row';button.innerHTML=`<strong>${esc(item.tradeNo)} · ${esc(item.scenario)}</strong><span>本地 ${esc(item.localStatus)}　通道 ${esc(item.channelStatus)}　${fmt(item.occurredAt)}</span>`;button.onclick=()=>selectTrade(item.tradeNo);node.append(button)})}catch(e){node.innerHTML=`<div class="alert">${esc(e.message)}</div>`}}
async function selectAnomaly(id){const version=++selectionVersion;cancelPolling();selected=id;selectedTradeNo=null;currentSnapshotHash=null;$('tradeStatus').textContent='读取中';$('detail').innerHTML='<div class="empty">正在载入交易证据…</div>';await loadAnomalies();try{const d=await request(`/anomalies/${id}`);if(version!==selectionVersion)return;selectedTradeNo=d.tradeNo;currentDetail=d;renderDetail(d);await loadAnalysisHistory(version)}catch(e){if(version==selectionVersion)$('detail').innerHTML=`<div class="alert">${esc(e.message)}</div>`}}
async function selectTrade(tradeNo){const version=++selectionVersion;cancelPolling();selectedTradeNo=tradeNo;selected=null;currentSnapshotHash=null;$('tradeStatus').textContent='读取中';$('detail').innerHTML='<div class="empty">正在载入交易证据…</div>';try{const d=await request(`/trades/${encodeURIComponent(tradeNo)}/timeline`);if(version!==selectionVersion)return;currentDetail=d;selected=d.abnormalId;renderDetail(d);await loadAnalysisHistory(version);await loadAnomalies()}catch(e){if(version===selectionVersion)$('detail').innerHTML=`<div class="alert">${esc(e.message)}</div>`}}
function renderDetail(d){$('tradeStatus').textContent=`本地 ${d.localStatus} · 通道 ${d.channelStatus}`;const events=d.timeline||[];const timeline=events.length?events.map(e=>`<div class="event"><time>${fmt(e.occurredAt)} · ${esc(e.type)} · ${esc(e.status)}</time><p>${esc(e.summary)}</p></div>`).join(''):'<div class="empty">尚无可展示的同步或回调记录。</div>';const amount=(Number(d.amount||0)/100).toFixed(2);const pending=String(d.handleStatus||'').toLowerCase()==='pending';let actions=d.abnormalId==null?`<div class="analysis-actions"><button class="soft" onclick="queryTrade()">查询模拟通道</button></div><p class="notice">当前交易没有待处理异常；未知结果不会被推断为支付成功或失败。</p>`:pending?`<div class="analysis-actions"><button class="soft" onclick="syncTrade()">重新查单</button><button class="primary" onclick="handle('confirm-success')">确认成功</button><button class="warn" onclick="handle('ignore')">忽略异常</button></div>`:`<p class="notice">此异常单已处置（${esc(d.handleStatus)}），处置操作已隐藏。</p>`;$('detail').innerHTML=`<div class="detail-grid"><section class="section"><h3>${d.abnormalId==null?'演示交易':'异常订单'}</h3><p><b>平台交易号：</b>${esc(d.tradeNo)}</p><p><b>业务单号：</b>${esc(d.bizOrderNo||'未关联异常订单')}</p><p><b>金额：</b>${amount} ${esc(d.currency)}</p><p><b>异常类型：</b>${esc(d.abnormalType||'NONE')} · 发现时本地状态 ${esc(d.abnormalStatus||'未知')}</p><p><b>当前状态：</b>${esc(d.localStatus)} / 通道 ${esc(d.channelStatus)}</p><p><b>人工处置：</b>${esc(d.handleStatus)}</p>${actions}</section><section class="section"><h3>交易证据时间线</h3><div class="timeline">${timeline}</div></section><section class="section analysis"><h3>AI 辅助分析</h3><div class="analysis-actions"><button class="primary" onclick="analyze()">生成分析</button><select id="analysisHistory"><option value="">加载历史分析…</option></select><button class="soft" onclick="loadAnalysisHistory(selectionVersion)">刷新历史</button><span id="analysisState" class="status">尚未分析</span></div><div id="analysisResult" class="result-block"></div><p class="notice">AI 只提供排查建议；资金状态仍由 DaxPay 业务流程和人工处置决定。</p></section></div>`}
async function loadAnalysisHistory(version){if(!selectedTradeNo)return;try{const history=await request(`/trades/${encodeURIComponent(selectedTradeNo)}/analyses?page=1&pageSize=20`);if(version!==selectionVersion)return;currentSnapshotHash=history.currentSnapshotHash;historyTasks=history.items||[];const select=$('analysisHistory');if(!select)return;select.innerHTML='<option value="">选择历史分析…</option>';historyTasks.forEach(task=>{const option=document.createElement('option');option.value=task.id;const meta=task.execution;const comparison=!meta||meta.legacy?'历史版本，无法自动核对':meta.snapshotHash===currentSnapshotHash?'当前证据':'基于历史证据';option.textContent=`${task.status} · ${comparison} · ${fmt(meta?.snapshotAt)}`;select.append(option)});select.onchange=()=>selectHistoricalAnalysis(select.value,version)}catch(e){if(version!==selectionVersion)return;const select=$('analysisHistory');if(select)select.innerHTML=`<option value="">历史加载失败：${esc(e.message)}</option>`}}
async function selectHistoricalAnalysis(taskId,version){if(!taskId)return;cancelPolling();try{const task=await request(`/trades/${encodeURIComponent(selectedTradeNo)}/analyses/${encodeURIComponent(taskId)}`);if(version!==selectionVersion)return;activeTask=task.id;$('analysisState').textContent=task.status;renderAnalysis(task,version)}catch(e){if(version===selectionVersion)$('analysisState').textContent=e.message}}
async function runScenario(){const b=$('runScenario');b.disabled=true;showMessage($('scenarioMessage'),'正在通过 DaxPay 创建演示订单…');try{const result=await request('/scenarios',{method:'POST',body:JSON.stringify({scenario:$('scenario').value})});lastScenarioTrade=result.tradeNo;showMessage($('scenarioMessage'),`${result.message} · 交易号 ${result.tradeNo}`);$('replay').hidden=result.scenario!=='CALLBACK_LOST';await Promise.all([loadAnomalies(),loadDemoTrades()]);await selectTrade(result.tradeNo)}catch(e){showMessage($('scenarioMessage'),e.message,true)}finally{b.disabled=false}}
async function replay(){if(!lastScenarioTrade)return;try{const result=await request(`/scenarios/${encodeURIComponent(lastScenarioTrade)}/replay-callback`,{method:'POST'});showMessage($('scenarioMessage'),`${result.message} · ${result.tradeNo}`);$('replay').hidden=true;await Promise.all([loadAnomalies(),loadDemoTrades()]);await selectTrade(result.tradeNo)}catch(e){showMessage($('scenarioMessage'),e.message,true)}}
async function analyze(){if(!selectedTradeNo)return;const version=selectionVersion,tradeNo=selectedTradeNo;try{const task=await request(`/trades/${encodeURIComponent(tradeNo)}/analyses`,{method:'POST',body:'{}'});if(version!==selectionVersion)return;activeTask=task.id;$('analysisHistory')?.value&&($('analysisHistory').value='');await loadAnalysisHistory(version);activeTask=task.id;await pollAnalysis(tradeNo,task.id,version)}catch(e){if(version===selectionVersion)$('analysisState').textContent=e.message}}
async function pollAnalysis(tradeNo,taskId,version){if(version!==selectionVersion||tradeNo!==selectedTradeNo)return;try{const task=await request(`/trades/${encodeURIComponent(tradeNo)}/analyses/${encodeURIComponent(taskId)}`);if(version!==selectionVersion||tradeNo!==selectedTradeNo)return;$('analysisState').textContent=`${task.status}${task.durationMs!=null?` · ${task.durationMs} ms`:''}`;if(task.status==='SUCCEEDED'){renderAnalysis(task,version);return}if(task.status==='FAILED'){$('analysisResult').innerHTML=`<div class="alert">分析失败：${esc(task.failureReason)} <button onclick="retryAnalysis()">重试</button></div>`;return}pollTimer=setTimeout(()=>pollAnalysis(tradeNo,taskId,version),1200)}catch(e){if(version===selectionVersion)$('analysisState').textContent=e.message}}
function renderAnalysis(task,version){if(version!==selectionVersion)return;const r=task.result;if(!r){$('analysisResult').textContent='分析结果为空';return}const facts=(r.facts||[]).map(item=>`<div class="fact">${esc(item.statement)}<div class="cite">证据：${esc((item.evidenceIds||[]).join(', ')||'无')}</div></div>`).join('');const causes=(r.possibleCauses||[]).map(item=>`<li><b>${esc(item.hypothesis)}</b> — 核查：${esc(item.verification)} <span class="cite">${esc((item.evidenceIds||[]).join(', '))}</span></li>`).join('');const steps=(r.checkSteps||[]).map(item=>`<li>${esc(item)}</li>`).join('');const missing=(r.missingInformation||[]).map(item=>`<li>${esc(item)}</li>`).join('');const chunks=task.execution?.retrievedKnowledge||[];const citations=(r.knowledgeCitations||[]).map(id=>{const chunk=chunks.find(item=>item.id===id);return `<div class="fact"><b>${esc(chunk?.title||id)}</b><div class="cite">${esc(id)}${chunk?` · ${esc(chunk.content)}`:''}</div></div>`}).join('');const usage=r.knowledgeUseStatus==='NOT_USED'?`已检索，但模型声明未采用：${esc(r.knowledgeOmissionReason||'未说明')}`:r.knowledgeUseStatus==='CITED'?'已引用检索知识':'没有匹配知识';const meta=task.execution;const comparison=!meta||meta.legacy?'历史版本，无法自动核对':meta.snapshotHash===currentSnapshotHash?'基于当前证据':'基于历史证据';const attempts=(task.attempts||[]).map(item=>`<li>第 ${item.attemptNo} 次：${esc(item.status)}${item.failureCode?` · ${esc(item.failureCode)}`:''}${item.durationMs!=null?` · ${item.durationMs} ms`:''}${item.promptTokens!=null||item.completionTokens!=null?` · Tokens ${item.promptTokens??'未知'} / ${item.completionTokens??'未知'}`:''}${item.returnedModelId?` · ${esc(item.returnedModelId)}`:''}</li>`).join('');$('analysisResult').innerHTML=`<p><b>${comparison}</b>${meta?.snapshotAt?` · 证据时间 ${fmt(meta.snapshotAt)}`:''}</p><p>${esc(r.summary)}</p><h4>已确认事实</h4>${facts||'<p>模型没有列出可确认事实。</p>'}<h4>待验证原因</h4><ul>${causes||'<li>没有待验证原因。</li>'}</ul><h4>排查步骤</h4><ol>${steps}</ol><h4>缺少的信息</h4><ul>${missing||'<li>无</li>'}</ul><h4>知识使用情况</h4><p>${usage}</p>${citations?`<h4>知识引用片段</h4>${citations}`:''}<h4>调用尝试</h4><ul>${attempts||'<li>无</li>'}</ul><p><a target="_blank" rel="noopener" href="${api}/trades/${encodeURIComponent(selectedTradeNo)}/analyses/${encodeURIComponent(task.id)}/report">导出 Markdown 报告</a></p>`}
async function retryAnalysis(){if(!activeTask||!selectedTradeNo)return;const version=selectionVersion;try{const task=await request(`/trades/${encodeURIComponent(selectedTradeNo)}/analyses/${encodeURIComponent(activeTask)}/retry`,{method:'POST',body:'{}'});if(version!==selectionVersion)return;activeTask=task.id;await pollAnalysis(selectedTradeNo,task.id,version)}catch(e){if(version===selectionVersion){const message=e.message.includes('REANALYSIS_REQUIRED')?'执行配置或知识版本已变化，请点击“生成分析”创建新任务。':e.message;$('analysisResult').innerHTML=`<div class="alert">${esc(message)}</div>`}}}
async function syncTrade(){if(!selected)return;if(!confirm('这会调用 DaxPay 通道查单。继续吗？'))return;try{await request(`/anomalies/${selected}/sync`,{method:'POST',body:'{}'});await selectAnomaly(selected)}catch(e){alert(e.message)}}
async function queryTrade(){if(!selectedTradeNo)return;const tradeNo=selectedTradeNo;try{await request(`/trades/${encodeURIComponent(tradeNo)}/sync`,{method:'POST',body:'{}'});await selectTrade(tradeNo)}catch(e){alert(e.message)}}
async function handle(action){if(!selected)return;const id=selected,remark=prompt(action==='ignore'?'请填写核实后忽略的原因：':'请填写已核实通道成功的依据：');if(!remark||!remark.trim())return;try{await request(`/anomalies/${id}/${action}`,{method:'POST',body:JSON.stringify({remark})});selected=null;currentDetail=null;await Promise.all([loadAnomalies(),loadDemoTrades()]);if(selectedTradeNo)await selectTrade(selectedTradeNo)}catch(e){alert(e.message)}}
 $('refresh').onclick=()=>Promise.all([loadAnomalies(),loadDemoTrades()]);$('runScenario').onclick=runScenario;$('replay').onclick=replay;const deepTradeNo=new URLSearchParams(location.search).get('tradeNo');Promise.all([loadAnomalies(),loadDemoTrades()]).then(()=>{if(deepTradeNo)selectTrade(deepTradeNo)});
</script>
</body></html>
