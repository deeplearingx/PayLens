<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PayLens 异常事件</title>
  <style>
    :root{--ink:#17231f;--muted:#64736e;--line:#dce5df;--paper:#f4f7f4;--panel:#fff;--green:#176b50;--pale:#e7f3ed;--amber:#986213;--red:#a63d37}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 "Segoe UI","Microsoft YaHei",sans-serif}header{display:flex;justify-content:space-between;align-items:center;padding:18px clamp(18px,4vw,52px);background:#102c23;color:white}.brand{font-size:21px;font-weight:700}.brand small{display:block;font-size:12px;font-weight:400;color:#b4c9bf}header a{color:#d8eee1}main{max-width:1440px;margin:24px auto;padding:0 20px}.intro{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:16px}.intro h1{margin:0;font-size:25px}.intro p{margin:4px 0;color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:16px;box-shadow:0 3px 14px #18372b0a}.head{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line)}.head h2{font-size:16px;margin:0}.body{padding:16px}.controls{display:flex;gap:8px;align-items:end;flex-wrap:wrap}label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}input,button,select{font:inherit;border:1px solid var(--line);border-radius:7px;background:white;color:var(--ink);padding:8px 10px}button{cursor:pointer}button.primary{background:var(--green);border-color:var(--green);color:white}button.soft{background:var(--pale);color:#185e47}button.warn{color:var(--red)}button:disabled{opacity:.55;cursor:wait}.grid{display:grid;grid-template-columns:minmax(300px,420px) minmax(0,1fr);gap:16px}.list{display:flex;flex-direction:column;gap:7px}.row{width:100%;text-align:left;padding:10px;border-radius:8px}.row.active{border-color:var(--green);background:#f2faf5}.row strong{display:block}.row small{display:block;color:var(--muted)}.event-row{display:flex;align-items:stretch;gap:6px}.event-row>input{align-self:center}.event-row .row{flex:1}.badge{font-size:11px;border-radius:999px;background:#edf1ee;padding:2px 8px}.badge.warn{background:#fff1d9;color:#815208}.badge.good{background:#e2f2e8;color:var(--green)}.detail{display:grid;grid-template-columns:1fr 1fr;gap:14px}.block{border:1px solid var(--line);border-radius:9px;padding:13px}.block h3{margin:0 0 10px;font-size:14px}.analysis{grid-column:1/-1}.member{padding:8px 0;border-bottom:1px solid #edf1ee}.member:last-child{border:0}.member small,.muted{color:var(--muted);font-size:12px}.member label{display:inline-flex;vertical-align:middle;margin-right:8px}.facts{padding-left:20px}.fact{background:#f5f8f5;border-radius:6px;padding:8px;margin:6px 0}.error{color:var(--red);padding:8px 0}.notice{color:var(--muted);font-size:12px}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.result h4{margin:13px 0 5px;font-size:13px}.result p{margin:5px 0}.empty{padding:24px;text-align:center;color:var(--muted)}@media(max-width:900px){.grid,.detail{grid-template-columns:1fr}.analysis{grid-column:auto}.intro{align-items:start;flex-direction:column}}
  </style>
</head>
<body>
<header><div class="brand">PayLens<small>PAYMENT INCIDENT WORKBENCH</small></div><nav><a href="/paylens">单笔异常工作台</a></nav></header>
<main>
  <div class="intro"><div><h1>支付异常事件</h1><p>从专用演示商户的支付异常记录生成事件候选；分组相似度是整理线索，不是根因置信度。</p></div></div>
  <section class="panel"><div class="head"><h2>扫描业务记录</h2><span class="badge">单批最多 500 条 · 时间跨度最多 24 小时</span></div><div class="body">
    <div class="controls"><label>开始时间<input id="from" type="datetime-local"></label><label>结束时间<input id="to" type="datetime-local"></label><button id="scan" class="primary">扫描并归并</button><span id="batchState" class="notice">仅读取专用演示商户中明确异常的支付、查单和回调记录。</span></div>
  </div></section>
  <div class="grid">
    <section class="panel"><div class="head"><h2>事件候选</h2><div class="actions"><span id="eventCount" class="badge">0</span><button id="mergeSelected" class="soft">合并选中事件</button></div></div><div id="events" class="body list"><div class="empty">先运行一次扫描。</div></div></section>
    <section class="panel"><div class="head"><h2>事件详情与 AI 分析</h2><span id="eventState" class="badge">未选择</span></div><div id="detail" class="body"><div class="empty">从左侧选择事件。</div></div></section>
  </div>
  <section class="panel"><div class="head"><h2>相似事件建议</h2><button class="soft" onclick="loadMergeSuggestions()">查看当前事件建议</button></div><div class="body" id="mergeSuggestions"><p class="notice">选择事件后可查看候选；建议只供人工复核。</p></div></section>
</main>
<script>
const api='/paylens/api';const $=id=>document.getElementById(id);let batchId=null,selectedIncident=null,selection=0,pollTimer=null,activeAnalysis=null,currentIncident=null,currentPageItems=[];
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function localInput(date){const shifted=new Date(date.getTime()-date.getTimezoneOffset()*60000);return shifted.toISOString().slice(0,16)}
function fmt(v){return v?new Date(v).toLocaleString('zh-CN'):'时间未知'}
async function request(path,options={}){const res=await fetch(api+path,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(options.headers||{})},...options});const json=(res.headers.get('content-type')||'').includes('json');const body=json?await res.json():await res.text();if(!res.ok)throw new Error(typeof body==='string'?body:(body.message||body.msg||`HTTP ${res.status}`));if(json&&typeof body?.code==='number'&&body.code!==0)throw new Error(body.message||body.msg||`业务请求失败 ${body.code}`);return body&&Object.hasOwn(body,'data')?body.data:body}
function stopPolling(){if(pollTimer)clearTimeout(pollTimer);pollTimer=null}
async function startScan(){const button=$('scan');button.disabled=true;$('batchState').textContent='扫描任务已提交…';try{const batch=await request('/incident-batches',{method:'POST',body:JSON.stringify({from:new Date($('from').value).toISOString(),to:new Date($('to').value).toISOString(),idempotencyKey:crypto.randomUUID()})});batchId=batch.id;await pollBatch(batch.id)}catch(e){$('batchState').textContent=e.message;$('batchState').className='error';button.disabled=false}}
async function pollBatch(id){try{const batch=await request(`/incident-batches/${encodeURIComponent(id)}`);$('batchState').textContent=`${batch.status} · ${batch.inputCount} 条观察 · ${batch.executionMode||'待定'}${batch.failureCode?` · ${batch.failureCode}`:''}`;if(batch.status==='QUEUED'||batch.status==='RUNNING'){pollTimer=setTimeout(()=>pollBatch(id),900);return}$('scan').disabled=false;if(batch.status==='SUCCEEDED')await loadIncidents(id)}catch(e){$('batchState').textContent=e.message;$('batchState').className='error';$('scan').disabled=false}}
async function loadIncidents(id){try{const page=await request(`/incident-batches/${encodeURIComponent(id)}/incidents?page=1&pageSize=50`);currentPageItems=page.items||[];$('eventCount').textContent=page.total;const box=$('events');box.replaceChildren();if(!page.items.length){box.innerHTML='<div class="empty">此范围没有检测到明确异常记录。</div>';return}page.items.forEach(event=>{const stats=event.statistics||{};const wrap=document.createElement('div');wrap.className='event-row';const pick=document.createElement('input');pick.type='checkbox';pick.dataset.incidentId=event.id;pick.dataset.version=event.version;pick.title='选择合并';pick.onclick=ev=>ev.stopPropagation();const button=document.createElement('button');button.className='row'+(selectedIncident===event.id?' active':'');button.innerHTML=`<strong>${stats.observationCount??0} 条观察 · ${stats.distinctTradeCount??0} 笔交易</strong><small>${esc(event.executionMode)} · ${esc(event.reviewStatus)} · ${esc(event.algorithmVersion)}</small><small>${esc(JSON.stringify(stats.typeDistribution||{}))}</small>`;button.onclick=()=>selectIncident(event.id);wrap.append(pick,button);box.append(wrap)})}catch(e){$('events').innerHTML=`<div class="error">${esc(e.message)}</div>`}}
function cancelSelection(){selection++;stopPolling();activeAnalysis=null;currentIncident=null;return selection}
async function selectIncident(id){const version=cancelSelection();selectedIncident=id;$('eventState').textContent='读取中';$('detail').innerHTML='<div class="empty">正在读取不可变事件快照…</div>';try{const d=await request(`/incidents/${encodeURIComponent(id)}`);if(version!==selection)return;renderIncident(d);await loadAnalysisHistory(version)}catch(e){if(version===selection)$('detail').innerHTML=`<div class="error">${esc(e.message)}</div>`}}
function renderIncident(d){currentIncident=d;$('eventState').textContent=`版本 ${d.version} · ${d.reviewStatus} · ${d.executionMode}`;const stats=d.statistics||{};const evidence=d.groupingEvidence||{};const members=(d.members||[]).map(item=>`<div class="member"><label><input type="checkbox" data-member-id="${esc(item.id)}"> 拆分</label><b>${esc(item.phase)} · ${esc(item.abnormalType||'未知类型')} · ${esc(item.errorCode||'无错误码')}</b><small>${fmt(item.occurredAt)} · 交易 ${esc(item.tradeNo)} · ${esc(item.channel||'通道未知')}</small><div>${esc(item.normalizedDescription)}</div><small><a href="/paylens?tradeNo=${encodeURIComponent(item.tradeNo)}">打开单笔交易</a></small></div>`).join('');$('detail').innerHTML=`<div class="detail"><section class="block"><h3>Java 统计</h3><p>观察记录：${esc(stats.observationCount)} · 去重交易：${esc(stats.distinctTradeCount)}</p><p>时间：${fmt(stats.firstObservedAt)} 至 ${fmt(stats.lastObservedAt)}</p><p>异常分布：${esc(JSON.stringify(stats.typeDistribution||{}))}</p><p>涉及订单金额（非资金损失）：${esc(JSON.stringify(stats.ordersAmountByCurrency||{}))}</p><p class="notice">分组依据：${esc(evidence.algorithmVersion)} · 最低成对相似度 ${evidence.minimumPairwiseSimilarity==null?'无（单条）':esc(evidence.minimumPairwiseSimilarity)}；该数值不代表根因置信度。</p><div class="actions"><button class="primary" onclick="createAnalysis()">生成事件分析</button><select id="analysisHistory"><option value="">读取历史分析…</option></select><button class="soft" onclick="loadAnalysisHistory(selection)">刷新历史</button><button class="soft" onclick="splitSelected()">拆分勾选成员</button><button class="soft" onclick="refreshProgress()">刷新处理进度</button><span id="analysisStatus" class="badge">尚未分析</span><span id="currentProgress" class="notice"></span></div></section><section class="block"><h3>分组边界与版本</h3><p>商户范围：专用演示商户</p><p>业务类型：${esc(evidence.hardBoundary?.businessType)} · 阶段：${esc(evidence.hardBoundary?.phase)}</p><p>通道：${esc(evidence.hardBoundary?.channel)} · 异常类型：${esc(evidence.hardBoundary?.abnormalType)}</p><p>算法：${esc(evidence.algorithmVersion)} · 模式：${esc(evidence.executionMode)}</p><p class="notice">AI 与语义模型只辅助事件归并和分析，支付状态仍由 DaxPay 业务流程及人工处置决定。</p></section><section class="block" style="grid-column:1/-1"><h3>成员记录（${(d.members||[]).length}）</h3>${members||'<p class="empty">没有成员。</p>'}</section><section class="block analysis"><h3>AI 事件分析</h3><div id="analysisResult" class="result"><p class="notice">分析输入仅包含脱敏后的代表性证据、Java 统计和最多三条知识片段。</p></div></section></div>`}
async function loadAnalysisHistory(version){if(!selectedIncident)return;try{const history=await request(`/incidents/${encodeURIComponent(selectedIncident)}/analyses?page=1&pageSize=20`);if(version!==selection)return;const select=$('analysisHistory');if(!select)return;select.innerHTML='<option value="">选择历史分析…</option>';history.items.forEach(task=>{const option=document.createElement('option');option.value=task.id;option.textContent=`${task.status} · 事件版本 ${task.incidentVersion} · ${fmt(task.execution?.snapshotAt)}`;select.append(option)});select.onchange=()=>selectAnalysis(select.value,version)}catch(e){const select=$('analysisHistory');if(select)select.innerHTML=`<option value="">历史读取失败：${esc(e.message)}</option>`}}
async function selectAnalysis(id,version){if(!id)return;try{const task=await request(`/incidents/${encodeURIComponent(selectedIncident)}/analyses/${encodeURIComponent(id)}`);if(version!==selection)return;activeAnalysis=task.id;$('analysisStatus').textContent=task.status;renderAnalysis(task,version)}catch(e){if(version===selection)$('analysisStatus').textContent=e.message}}
async function createAnalysis(){const version=selection;const id=selectedIncident;try{const task=await request(`/incidents/${encodeURIComponent(id)}/analyses`,{method:'POST',body:'{}'});if(version!==selection)return;activeAnalysis=task.id;await loadAnalysisHistory(version);activeAnalysis=task.id;pollAnalysis(id,task.id,version)}catch(e){if(version===selection)$('analysisStatus').textContent=e.message}}
async function pollAnalysis(eventId,id,version){if(version!==selection||eventId!==selectedIncident)return;try{const task=await request(`/incidents/${encodeURIComponent(eventId)}/analyses/${encodeURIComponent(id)}`);if(version!==selection)return;$('analysisStatus').textContent=`${task.status}${task.durationMs!=null?` · ${task.durationMs} ms`:''}`;if(task.status==='SUCCEEDED'){renderAnalysis(task,version);return}if(task.status==='FAILED'){$('analysisResult').innerHTML=`<div class="error">分析失败：${esc(task.failureCode)} <button class="soft" onclick="retryAnalysis()">重试</button></div>`;return}pollTimer=setTimeout(()=>pollAnalysis(eventId,id,version),1000)}catch(e){if(version===selection)$('analysisStatus').textContent=e.message}}
function renderAnalysis(task,version){if(version!==selection)return;const r=task.result;if(!r){$('analysisResult').textContent='当前任务尚无结果';return}const facts=(r.facts||[]).map(x=>`<div class="fact">${esc(x.statement)}<small>证据：${esc((x.evidenceIds||[]).join(', '))}</small></div>`).join('');const diffs=(r.differences||[]).map(x=>`<li>${esc(x.description)} <small>${esc((x.evidenceIds||[]).join(', '))}</small></li>`).join('');const causes=(r.possibleExplanations||[]).map(x=>`<li><b>${esc(x.hypothesis)}</b>（待验证）— ${esc(x.verification)} <small>${esc((x.evidenceIds||[]).join(', '))}</small></li>`).join('');const citations=(r.knowledgeCitations||[]).map(id=>{const c=(task.execution?.retrievedKnowledge||[]).find(x=>x.id===id);return `<div class="fact"><b>${esc(c?.title||id)}</b><small>${esc(id)} · ${esc(c?.content||'')}</small></div>`}).join('');const attempts=(task.attempts||[]).map(x=>`<li>第 ${x.attemptNo} 次：${esc(x.status)} ${esc(x.failureCode||'')} ${x.durationMs??''} ms Token ${x.promptTokens??'未知'}/${x.completionTokens??'未知'}</li>`).join('');$('analysisResult').innerHTML=`<p><b>共同现象</b> ${esc(r.commonPhenomenon)}</p><h4>已确认事实</h4>${facts||'<p>无</p>'}<h4>组内差异</h4><ul>${diffs||'<li>模型未指出差异</li>'}</ul><h4>待验证解释</h4><ul>${causes||'<li>没有待验证解释</li>'}</ul><h4>核查步骤</h4><ol>${(r.checkSteps||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ol><h4>缺失信息</h4><ul>${(r.missingInformation||[]).map(x=>`<li>${esc(x)}</li>`).join('')||'<li>无</li>'}</ul><h4>知识引用 · ${esc(r.knowledgeUseStatus)}</h4>${citations||`<p>${esc(r.knowledgeOmissionReason||'没有匹配知识')}</p>`}<h4>调用尝试</h4><ul>${attempts||'<li>无</li>'}</ul><p><a target="_blank" rel="noopener" href="${api}/incidents/${encodeURIComponent(selectedIncident)}/analyses/${encodeURIComponent(task.id)}/report">导出 Markdown</a></p>`}
async function retryAnalysis(){if(!activeAnalysis||!selectedIncident)return;const version=selection;try{const task=await request(`/incidents/${encodeURIComponent(selectedIncident)}/analyses/${encodeURIComponent(activeAnalysis)}/retry`,{method:'POST',body:'{}'});if(version===selection)pollAnalysis(selectedIncident,task.id,version)}catch(e){if(version===selection)$('analysisResult').innerHTML=`<div class="error">${esc(e.message)}</div>`}}
async function splitSelected(){if(!currentIncident)return;const selected=[...document.querySelectorAll('[data-member-id]:checked')].map(box=>box.dataset.memberId);const all=(currentIncident.members||[]).map(item=>item.id);const remaining=all.filter(id=>!selected.includes(id));if(!selected.length||!remaining.length){$('analysisStatus').textContent='需至少勾选一条，并保留一条在当前事件';return}const members=new Map(currentIncident.members.map(item=>[item.id,item]));const preview=selected.map(id=>members.get(id)).filter(Boolean).map(item=>`${item.id} · ${item.phase} · ${item.tradeNo}`).join('\n');if(!confirm(`拆分预览：${selected.length} 条成员移入新事件，${remaining.length} 条保留在当前事件。\n\n移出成员：\n${preview}\n\n继续？`))return;const remark=prompt('填写本次拆分原因（必填，最多 500 字）：');if(!remark||!remark.trim())return;const version=selection;try{const result=await request(`/incidents/${encodeURIComponent(currentIncident.id)}/split`,{method:'POST',body:JSON.stringify({expectedVersion:currentIncident.version,groups:[remaining,selected],remark:remark.trim()})});if(version!==selection)return;await loadIncidents(batchId);await selectIncident(result.incidentIds[0]);$('analysisStatus').textContent=`拆分完成：${result.memberCounts.join(' / ')} 条`;}catch(e){if(version===selection)$('analysisStatus').textContent=e.message}}
async function mergeSelected(){if(!batchId)return;const selected=[...document.querySelectorAll('#events input[data-incident-id]:checked')];if(selected.length<2){$('batchState').textContent='请先勾选至少两个事件';return}const ids=selected.map(box=>box.dataset.incidentId);const rows=ids.map(id=>currentPageItems.find(item=>item.id===id)).filter(Boolean);const preview=rows.map(row=>`${row.id} · ${row.statistics?.observationCount??0} 条观察 · ${row.statistics?.distinctTradeCount??0} 笔交易 · v${row.version}`).join('\n');const total=rows.reduce((sum,row)=>sum+(row.statistics?.observationCount??0),0);if(!confirm(`合并预览：${rows.length} 个事件、共 ${total} 条观察将并入一个事件；其余事件会保留为已归档历史。\n\n${preview}\n\n继续？`))return;const remark=prompt('填写本次合并原因（必填，最多 500 字）：');if(!remark||!remark.trim())return;try{const result=await request('/incidents/merge',{method:'POST',body:JSON.stringify({incidents:rows.map(row=>({incidentId:row.id,version:row.version})),remark:remark.trim()})});await loadIncidents(batchId);await selectIncident(result.incidentId);$('analysisStatus').textContent=`合并完成：${result.memberCount} 条观察；旧事件已归档`;}catch(e){$('batchState').textContent=e.message}}
async function refreshProgress(){if(!currentIncident)return;try{const result=await request(`/incidents/${encodeURIComponent(currentIncident.id)}/refresh`,{method:'POST',body:'{}'});$('currentProgress').textContent=`当前交易状态（${result.distinctTradeCount} 笔）：${JSON.stringify(result.currentStatusDistribution||{})} · ${fmt(result.refreshedAt)}`}catch(e){$('currentProgress').textContent=e.message}}
async function loadMergeSuggestions(){
  if(!selectedIncident){$('mergeSuggestions').textContent='请先选择事件';return}
  const selected=selectedIncident;
  try{
    const data=await request(`/incidents/${encodeURIComponent(selected)}/merge-suggestions`);
    if(selected!==selectedIncident)return;
    if(data.status!=='READY'){$('mergeSuggestions').textContent=data.status==='UNAVAILABLE'?'本地向量模型暂不可用':'候选建议尚未通过校准';return}
    if(!data.items.length){$('mergeSuggestions').textContent='当前没有达到阈值的相似事件建议';return}
    $('mergeSuggestions').innerHTML='<p class="notice">相似度只表示异常现象接近，不代表共同根因。</p>'+data.items.map(item=>`<div class="fact"><b>${esc(item.incidentId)}</b> · 相似度 ${Number(item.similarity).toFixed(3)}<small>${esc(item.representativeDescription)} · ${esc(item.ruleCheck)}</small><button class="soft" onclick="confirmMergeSuggestion('${encodeURIComponent(item.incidentId)}',${item.sourceVersion},${item.candidateVersion})">人工确认合并</button></div>`).join('');
  }catch(error){$('mergeSuggestions').textContent=error.message}
}
async function confirmMergeSuggestion(encodedId,sourceVersion,candidateVersion){
  if(!selectedIncident)return;
  const candidateId=decodeURIComponent(encodedId);
  const remark=prompt('填写人工确认合并的原因（必填）：');
  if(!remark||!remark.trim())return;
  try{
    const result=await request('/incidents/merge',{method:'POST',body:JSON.stringify({incidents:[{incidentId:selectedIncident,version:sourceVersion},{incidentId:candidateId,version:candidateVersion}],remark:remark.trim()})});
    await loadIncidents(batchId);await selectIncident(result.incidentId);$('mergeSuggestions').textContent='合并完成，操作已记录审计。';
  }catch(error){$('mergeSuggestions').textContent=error.message}
}
const originalRenderAnalysis=renderAnalysis;
function failureExplanation(code){return ({MODEL_TIMEOUT:'模型请求超时，请稍后重试',MODEL_TASK_TIMEOUT:'任务内模型调用时限已用尽',MODEL_RATE_LIMITED:'模型服务限流，请稍后重试',RETRIEVAL_MODE_UNAVAILABLE:'提交时选定的本地向量检索模式已不可用，请重新分析',INVALID_EVIDENCE_REFERENCE:'模型引用了本次证据之外的 ID',INVALID_KNOWLEDGE_CITATION:'模型引用了本次检索之外的知识',REPAIR_CONTEXT_TOO_LARGE:'格式修复上下文超过 16 KB',INVALID_STRUCTURE:'模型输出结构不符合契约',INVALID_JSON:'模型输出不是有效 JSON'})[code]||code||'未知错误'}
const originalPollAnalysis=pollAnalysis;
pollAnalysis=async function(eventId,id,version){await originalPollAnalysis(eventId,id,version);if(version!==selection||!activeAnalysis)return;const box=$('analysisResult');if(box&&box.textContent.startsWith('分析失败：')){const code=box.textContent.replace('分析失败：','').split('重试')[0].trim();box.querySelector('.error')?.prepend(document.createTextNode(failureExplanation(code)+' · '))}}
renderAnalysis=function(task,version){
  originalRenderAnalysis(task,version);
  if(version!==selection||!task.result)return;
  const calls=(task.modelCalls||[]).map(call=>`<li>${esc(call.kind)} · ${esc(call.status)} · ${esc(call.failureCode||'')} · ${call.durationMs??'未知'} ms · Token ${call.promptTokens??'未知'}/${call.completionTokens??'未知'}</li>`).join('');
  $('analysisResult').insertAdjacentHTML('beforeend',`<p class="notice">检索模式：${esc(task.execution?.retrievalMode||'KEYWORD')} · 排队 ${task.queueDurationMs??'未知'} ms · 格式修复 ${Math.max(0,(task.modelCalls||[]).filter(call=>call.kind==='FORMAT_REPAIR').length)} 次</p><h4>模型调用明细</h4><ul>${calls||'<li>历史任务无调用明细</li>'}</ul>`);
};
$('scan').onclick=startScan;$('mergeSelected').onclick=mergeSelected;const now=new Date();const scanEnd=new Date(now);scanEnd.setSeconds(0,0);scanEnd.setMinutes(scanEnd.getMinutes()+1);$('to').value=localInput(scanEnd);$('from').value=localInput(new Date(scanEnd.getTime()-3600000));
</script>
