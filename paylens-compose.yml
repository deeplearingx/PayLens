services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: daxpay
      POSTGRES_USER: paylens
      POSTGRES_PASSWORD: paylens_local_only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - paylens-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paylens -d daxpay"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "paylens_local_only"]
    ports:
      - "127.0.0.1:6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "paylens_local_only", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  artemis:
    image: apache/activemq-artemis:2.37.0-alpine
    environment:
      ARTEMIS_USER: paylens
      ARTEMIS_PASSWORD: paylens_local_only
      ANONYMOUS_LOGIN: "false"
    ports:
      - "127.0.0.1:61617:61616"
      - "127.0.0.1:8162:8161"
    volumes:
      - paylens-artemis:/var/lib/artemis-instance
volumes:
  paylens-postgres:
  paylens-artemis:
